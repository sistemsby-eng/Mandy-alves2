<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d12">
  <meta name="description" content="Acesse o Telegram oficial da Mandy Alves.">
  <title>Mandy Alves | Acesso oficial</title>
  <style>
    :root { color-scheme: dark; --bg:#100d12; --pink:#ff4f91; --pink2:#ff8ab5; --muted:#c7b9c2; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#fff; background:
        radial-gradient(ellipse at 15% 15%, rgba(255,79,145,.22), transparent 38%),
        radial-gradient(ellipse at 90% 85%, rgba(132,65,150,.22), transparent 42%), var(--bg);
    }
    .card {
      width:min(100%,430px); padding:42px 28px 30px; text-align:center; border-radius:28px;
      background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
      border:1px solid rgba(255,255,255,.13); box-shadow:0 24px 80px rgba(0,0,0,.45);
      backdrop-filter:blur(14px);
    }
    .avatar {
      width:108px; height:108px; margin:0 auto 22px; border-radius:50%; display:grid; place-items:center;
      background:linear-gradient(135deg,var(--pink),#9b4dba); padding:3px;
      box-shadow:0 0 36px rgba(255,79,145,.28);
    }
    .avatar span {
      width:100%; height:100%; border-radius:50%; display:grid; place-items:center;
      background:#21151f; font-size:36px; font-weight:800; letter-spacing:-2px;
    }
    .eyebrow { color:var(--pink2); text-transform:uppercase; letter-spacing:3px; font-size:11px; font-weight:800; }
    h1 { margin:10px 0 10px; font-size:36px; letter-spacing:-1.5px; }
    p { margin:0 auto; max-width:310px; color:var(--muted); font-size:15px; line-height:1.6; }
    .cta {
      display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin:28px 0 16px;
      padding:17px 20px; border-radius:15px; text-decoration:none; color:#fff; font-weight:800; font-size:16px;
      background:linear-gradient(100deg,#229ed9,#168ac5); box-shadow:0 10px 28px rgba(34,158,217,.22);
      transition:transform .18s ease,filter .18s ease;
    }
    .cta:hover { transform:translateY(-2px); filter:brightness(1.08); }
    .telegram-icon { width:21px; height:21px; fill:currentColor; }
    .note { font-size:12px; color:#a99aa5; }
    .footer { margin-top:28px; padding-top:18px; border-top:1px solid rgba(255,255,255,.09); font-size:11px; color:#8f818b; }
    @media (max-width:360px) { .card{padding:34px 20px 24px} h1{font-size:31px} }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true"><span>MA</span></div>
    <div class="eyebrow">Canal oficial</div>
    <h1>Mandy Alves</h1>
    <p>Entre no meu Telegram e acompanhe as novidades por lá. Te espero! 💗</p>
    <a class="cta" href="https://t.me/Mandyyalvss_bot" aria-label="Abrir Telegram da Mandy Alves">
      <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 4.3 18.5 19c-.2 1-.8 1.2-1.6.8l-4.4-3.3-2.1 2c-.2.2-.4.4-.8.4l.3-4.5 8.2-7.4c.4-.3-.1-.5-.6-.2L7.4 13.2 3 11.8c-1-.3-1-1 .2-1.5L20.3 3.7c.8-.3 1.6.2 1.4.6Z"/></svg>
      Entrar no Telegram
    </a>
    <div class="note">O link funciona em iPhone, Android e computador.</div>
    <div class="footer">© <span id="year"></span> Mandy Alves · Acesso oficial</div>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
